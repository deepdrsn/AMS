{% extends 'base.html' %}

{% block title %}Login - Hajiri{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3">Hajiri Login</h3>

          {% if form.errors %}
            <div class="alert alert-danger">Invalid credentials</div>
          {% endif %}

          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Username or Email</label>
              {{ form.username }}
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              {{ form.password }}
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>

          <div class="text-center mt-3">
            <a href="{% url 'password_reset' %}">Forgot password?</a>
          </div>

        </div>
      </div>
      <div class="text-muted small mt-3">Use your internship credentials.</div>
    </div>
  </div>
</div>

<script>
  // Basic Bootstrap styling for auth fields
  const inputs = document.querySelectorAll('input');
  inputs.forEach(i => i.classList.add('form-control'));
</script>
{% endblock %}
