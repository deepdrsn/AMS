{% extends 'base.html' %}

{% block title %}Password Reset - Complete - Hajiri{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3">Password changed</h3>
          <p class="text-muted">Your password has been updated. You can log in now.</p>
          <a class="btn btn-primary" href="{% url 'accounts:login' %}">Go to login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
