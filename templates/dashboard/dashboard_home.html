{% extends 'base.html' %}

{% block title %}Hajiri - Home{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-1">Hajiri</h3>
          <p class="text-muted mb-4">Intern attendance management system.</p>

          {% if user.is_authenticated %}
            <a class="btn btn-primary" href="{% url 'dashboard:intern_dashboard' %}">Go to Dashboard</a>
          {% else %}
            <a class="btn btn-primary" href="{% url 'accounts:login' %}">Login</a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
